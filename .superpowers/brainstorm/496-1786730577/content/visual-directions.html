<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RefTone 视觉方向</title>
<style>
:root{--ink:#101113;--panel:#191b20;--line:#343842;--text:#f4f1e9;--muted:#aeb3bc;--accent:#e7a869}*{box-sizing:border-box}body{margin:0;background:#0c0d10;color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:52px 24px 72px}h1{font-size:clamp(28px,4vw,48px);letter-spacing:-.04em;margin:0 0 10px}.intro{color:var(--muted);margin:0 0 34px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.choice{cursor:pointer;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);transition:.2s}.choice:hover,.choice.selected{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 18px 44px #0008}.visual{height:250px;position:relative;overflow:hidden}.copy{padding:20px}.copy h2{font-size:19px;margin:0 0 8px}.copy p{font-size:14px;line-height:1.65;color:var(--muted);margin:0}.label{display:inline-block;color:#181208;background:var(--accent);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;margin-bottom:12px}.a{background:radial-gradient(circle at 70% 15%,#efad6f36,transparent 32%),linear-gradient(135deg,#111319,#29211e)}.a .rail{position:absolute;left:22px;top:22px;bottom:22px;width:45px;border-right:1px solid #ffffff20}.a .rail i{display:block;width:17px;height:17px;border-radius:50%;border:1px solid #ffffff50;margin:14px}.a .shot{position:absolute;left:86px;right:20px;top:22px;height:108px;border-radius:10px;background:linear-gradient(120deg,#594135,#17191e 58%);border:1px solid #ffffff18}.a .shot:after{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:#d09675;left:54%;top:29px;box-shadow:0 0 0 18px #2d2626}.a .controls{position:absolute;left:86px;right:20px;bottom:23px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.a .controls i{height:55px;border-radius:8px;background:#ffffff0b;border:1px solid #ffffff10}.b{background:linear-gradient(135deg,#11151a,#1d2428)}.b .top{height:42px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;padding:0 18px;gap:7px}.b .top i{width:7px;height:7px;border-radius:99px;background:#adc9ca}.b .side{position:absolute;left:0;top:42px;bottom:0;width:77px;border-right:1px solid #ffffff12}.b .side:after{content:"REF\A  B\A  C\A  D";white-space:pre;position:absolute;left:22px;top:28px;color:#859498;font:11px monospace;line-height:31px}.b .canvas{position:absolute;left:95px;right:20px;top:61px;bottom:18px;border-radius:8px;background:linear-gradient(140deg,#3f4747,#192024 58%,#202830);border:1px solid #ffffff12}.b .canvas:before{content:"Portrait / 04";position:absolute;left:15px;top:13px;font:11px monospace;color:#e6f0ee}.b .canvas:after{content:"";position:absolute;width:38%;aspect-ratio:1;border-radius:50% 50% 45% 45%;left:33%;top:25%;background:linear-gradient(135deg,#9b7567,#c69f86)}.c{background:#171415}.c .frame{position:absolute;inset:24px;border:1px solid #8f7b602f}.c .frame:before{content:"REFERENCE / STUDY 01";position:absolute;left:16px;top:14px;font:10px Georgia;color:#c8aa7b;letter-spacing:.15em}.c .image{position:absolute;left:24px;right:24px;top:62px;height:116px;background:linear-gradient(145deg,#523c33,#2a2423 48%,#70634e);filter:saturate(.8)}.c .image:after{content:"";position:absolute;left:47%;top:18px;width:54px;height:82px;border-radius:45% 45% 38% 38%;background:#b78368}.c .metric{position:absolute;left:40px;right:40px;bottom:28px;height:23px;display:flex;gap:4px;align-items:end}.c .metric i{display:block;flex:1;background:#d6a062}.c .metric i:nth-child(2){height:75%}.c .metric i:nth-child(3){height:46%}.c .metric i:nth-child(4){height:90%}@media(max-width:800px){.grid{grid-template-columns:1fr}.visual{height:210px}}
</style></head><body><main class="wrap"><h1>RefTone 的视觉方向</h1><p class="intro">请选择最贴近你希望的专业感。三个方向均保留现有功能、中文内容与深色主题。</p><div class="grid">
<article class="choice" data-choice="a" onclick="toggleSelect(this)"><div class="visual a"><div class="rail"><i></i><i></i><i></i></div><div class="shot"></div><div class="controls"><i></i><i></i><i></i><i></i></div></div><div class="copy"><span class="label">推荐</span><h2>暗房控制台</h2><p>暖琥珀作为唯一强调色。强化参数层级与可扫描性，像成熟的摄影软件而不失质感。</p></div></article>
<article class="choice" data-choice="b" onclick="toggleSelect(this)"><div class="visual b"><div class="top"><i></i><i></i><i></i></div><div class="side"></div><div class="canvas"></div></div><div class="copy"><h2>冷静专业工具</h2><p>蓝灰中性色与紧凑的网格秩序，偏向桌面级专业软件。信息密度更高，情绪表达更克制。</p></div></article>
<article class="choice" data-choice="c" onclick="toggleSelect(this)"><div class="visual c"><div class="frame"></div><div class="image"></div><div class="metric"><i style="height:38%"></i><i></i><i></i><i></i><i style="height:65%"></i></div></div><div class="copy"><h2>编辑部影像笔记</h2><p>更强调参考图与调色判断的叙事感，适合把页面呈现为可信赖的审美分析报告。</p></div></article>
</div></main></body></html>
